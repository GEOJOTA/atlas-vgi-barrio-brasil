<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="kdeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="heatCore1" cx="45%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCore2" cx="68%" cy="62%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCore3" cx="28%" cy="65%" r="28%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#kdeBg)"/>

  <!-- Cuadrícula métrica 20m -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="40" y1="0" x2="40" y2="800"/><line x1="80" y1="0" x2="80" y2="800"/><line x1="120" y1="0" x2="120" y2="800"/><line x1="160" y1="0" x2="160" y2="800"/><line x1="200" y1="0" x2="200" y2="800"/><line x1="240" y1="0" x2="240" y2="800"/><line x1="280" y1="0" x2="280" y2="800"/><line x1="320" y1="0" x2="320" y2="800"/><line x1="360" y1="0" x2="360" y2="800"/><line x1="400" y1="0" x2="400" y2="800"/><line x1="440" y1="0" x2="440" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/><line x1="520" y1="0" x2="520" y2="800"/><line x1="560" y1="0" x2="560" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/><line x1="640" y1="0" x2="640" y2="800"/><line x1="680" y1="0" x2="680" y2="800"/><line x1="720" y1="0" x2="720" y2="800"/><line x1="760" y1="0" x2="760" y2="800"/><line x1="800" y1="0" x2="800" y2="800"/><line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="440" x2="800" y2="440"/><line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="560" x2="800" y2="560"/><line x1="0" y1="600" x2="800" y2="600"/><line x1="0" y1="640" x2="800" y2="640"/><line x1="0" y1="680" x2="800" y2="680"/><line x1="0" y1="720" x2="800" y2="720"/><line x1="0" y1="760" x2="800" y2="760"/><line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- Núcleos térmicos continuos KDE -->
  <circle cx="360" cy="360" r="320" fill="url(#heatCore1)"/>
  <circle cx="540" cy="480" r="240" fill="url(#heatCore2)"/>
  <circle cx="240" cy="520" r="200" fill="url(#heatCore3)"/>

  <!-- Curvas de nivel e Isolíneas de Densidad Cuártica -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 140,500 Q 180,240 380,200 T 640,320 T 680,560 T 480,680 T 200,640 Z" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,6"/>
    <path d="M 200,480 Q 240,280 400,250 T 600,360 T 620,520 T 460,620 T 260,580 Z" stroke="#34d399" stroke-width="3"/>
    <path d="M 260,450 Q 300,320 420,290 T 560,390 T 560,490 T 440,560 T 310,520 Z" stroke="#fbbf24" stroke-width="3.5"/>
    <path d="M 310,420 Q 340,340 430,320 T 510,400 T 500,460 T 410,500 T 340,460 Z" stroke="#f87171" stroke-width="4"/>
    <path d="M 360,390 Q 390,360 440,350 T 480,410 T 440,450 T 380,430 Z" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Puntos muestreados -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="420" cy="380" r="5"/>
    <circle cx="350" cy="420" r="4"/>
    <circle cx="470" cy="440" r="4"/>
    <circle cx="530" cy="370" r="3.5"/>
    <circle cx="270" cy="490" r="4"/>
    <circle cx="310" cy="560" r="3.5"/>
    <circle cx="580" cy="520" r="4"/>
  </g>

  <!-- Radio de búsqueda h (Silverman 1986) -->
  <circle cx="420" cy="380" r="130" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <line x1="420" y1="380" x2="550" y2="380" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>
  <text x="485" y="370" fill="#fecdd3" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Radio h</text>

  <!-- Perfil de densidad 3D en la base -->
  <path d="M 80,720 Q 240,720 340,660 T 420,580 T 500,660 T 600,720 L 720,720" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.9"/>
  <polygon points="80,720 80,750 720,750 720,720 600,720 500,660 420,580 340,660 240,720" fill="#a855f7" fill-opacity="0.15"/>

  <!-- Rótulo -->
  <rect x="40" y="40" width="380" height="80" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="2">ESTIMACIÓN DE DENSIDAD DE KERNEL</text>
  <text x="60" y="98" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Superficies Continuas 2D (KDE)</text>
</svg>