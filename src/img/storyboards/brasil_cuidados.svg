<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="skyHealth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="40%" stop-color="#1e4d58"/>
      <stop offset="70%" stop-color="#4d8c8a"/>
      <stop offset="100%" stop-color="#a3cfbb"/>
    </linearGradient>
    <linearGradient id="facadeHealth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="casonaCare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Fondo degradado sereno matinal -->
  <rect width="800" height="800" fill="url(#skyHealth)"/>

  <!-- Silueta urbana sutil -->
  <path d="M0,520 L90,490 L210,515 L320,460 L450,500 L590,450 L710,480 L800,470 L800,600 L0,600 Z" fill="#134e4a" opacity="0.3"/>

  <!-- Centro de Salud Comunitario / CESFAM y Edificio de Atención -->
  <!-- Edificio Derecho: CESFAM y Red Asistencial -->
  <rect x="360" y="240" width="400" height="340" fill="url(#facadeHealth)" rx="6"/>
  <rect x="350" y="225" width="420" height="18" fill="#0f766e"/>
  <!-- Cruz de Salud Institucional con corazón de cuidado -->
  <circle cx="680" cy="300" r="38" fill="#0d9488"/>
  <path d="M670,285 L690,285 L690,295 L700,295 L700,305 L690,305 L690,315 L670,315 L670,305 L660,305 L660,295 L670,295 Z" fill="#ffffff"/>
  <!-- Ventanales de clínica / consultorio -->
  <g fill="#0284c7" opacity="0.85">
    <rect x="400" y="280" width="70" height="60" rx="3"/>
    <rect x="500" y="280" width="70" height="60" rx="3"/>
    <rect x="400" y="370" width="70" height="60" rx="3"/>
    <rect x="500" y="370" width="70" height="60" rx="3"/>
    <rect x="600" y="370" width="70" height="60" rx="3"/>
  </g>
  <!-- Letrero CESFAM y Red de Cuidados -->
  <rect x="385" y="460" width="310" height="32" rx="4" fill="#0f766e"/>
  <text x="540" y="482" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">CESFAM &amp; RED DE CUIDADOS</text>
  <!-- Acceso con rampa de accesibilidad universal -->
  <rect x="470" y="505" width="100" height="75" fill="#1e293b"/>
  <!-- Rampa azul universal -->
  <polygon points="420,580 470,550 470,580" fill="#0284c7"/>
  <circle cx="445" cy="560" r="6" fill="#ffffff"/>

  <!-- Edificio Izquierdo: Casona Típica Residencial de Adultos Mayores -->
  <rect x="40" y="260" width="300" height="320" fill="url(#casonaCare)" rx="4"/>
  <rect x="30" y="245" width="320" height="18" fill="#451a03"/>
  <polygon points="25,245 190,170 355,245" fill="#78350f"/>
  <!-- Ventana colonial con reja de hierro -->
  <rect x="80" y="295" width="60" height="95" rx="30" fill="#1e293b"/>
  <rect x="200" y="295" width="60" height="95" rx="30" fill="#1e293b"/>
  <line x1="110" y1="295" x2="110" y2="390" stroke="#fcd34d" stroke-width="2"/>
  <line x1="230" y1="295" x2="230" y2="390" stroke="#fcd34d" stroke-width="2"/>
  <!-- Puerta de madera noble -->
  <rect x="130" y="440" width="80" height="140" fill="#381a07" rx="3"/>
  <circle cx="195" cy="510" r="5" fill="#fcd34d"/>

  <!-- Vereda y calzada -->
  <rect x="0" y="580" width="800" height="220" fill="#334155"/>
  <rect x="0" y="570" width="800" height="20" fill="#64748b"/>
  <!-- Baldosas táctiles amarillas en vereda (Guía para personas ciegas y mayores) -->
  <rect x="0" y="590" width="800" height="16" fill="#eab308" opacity="0.9"/>

  <!-- Parque arbolado y banco de descanso para personas mayores -->
  <g>
    <!-- Árbol -->
    <path d="M120,680 Q130,520 100,420" stroke="#4a3728" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="380" r="95" fill="#15803d" opacity="0.95"/>
    <circle cx="140" cy="340" r="80" fill="#16a34a" opacity="0.9"/>
  </g>

  <!-- Banco de plaza de madera -->
  <rect x="180" y="620" width="120" height="10" fill="#78350f"/>
  <rect x="180" y="635" width="120" height="12" fill="#92400e"/>
  <line x1="195" y1="635" x2="195" y2="675" stroke="#1e293b" stroke-width="6"/>
  <line x1="285" y1="635" x2="285" y2="675" stroke="#1e293b" stroke-width="6"/>

  <!-- Figuras estilizadas: Persona mayor acompañada por cuidadora comunitaria -->
  <!-- Persona mayor con bastón -->
  <circle cx="230" cy="590" r="11" fill="#fed7aa"/>
  <circle cx="230" cy="583" r="8" fill="#e2e8f0"/> <!-- Cabello cano -->
  <path d="M222,604 L238,604 L240,650 L233,650 L230,622 L228,622 L226,650 L219,650 Z" fill="#475569"/>
  <line x1="242" y1="615" x2="250" y2="665" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/> <!-- Bastón -->

  <!-- Cuidadora / Profesional de la salud con uniforme celeste -->
  <circle cx="270" cy="585" r="11" fill="#fbcfe8"/>
  <path d="M260,598 L280,598 L284,655 L276,655 L273,626 L267,626 L264,655 L256,655 Z" fill="#0284c7"/>
  <!-- Brazo protector entrelazado -->
  <path d="M260,608 Q248,615 240,612" stroke="#0284c7" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Placa / Insignia Superior -->
  <rect x="30" y="30" width="350" height="42" rx="8" fill="#0f172a" opacity="0.94" stroke="#0d9488" stroke-width="1.5"/>
  <text x="48" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#2dd4bf" letter-spacing="1">BARRIO BRASIL</text>
  <text x="180" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">· Cuidados &amp; Red Sanitaria</text>
</svg>
