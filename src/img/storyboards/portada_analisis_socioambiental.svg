<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="envSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#envSky)"/>

  <!-- Rayos de luz ambiental -->
  <polygon points="0,0 200,0 350,800 0,800" fill="#10b981" opacity="0.1"/>
  <polygon points="300,0 550,0 700,800 450,800" fill="#34d399" opacity="0.08"/>

  <!-- Parque Central y Arbolado Urbano -->
  <g>
    <!-- Árbol 1 -->
    <rect x="170" y="460" width="20" height="180" fill="#78350f" rx="3"/>
    <circle cx="180" cy="420" r="80" fill="url(#treeGrad)" opacity="0.95"/>
    <circle cx="140" cy="450" r="60" fill="#059669" opacity="0.9"/>
    <circle cx="220" cy="440" r="65" fill="#10b981" opacity="0.9"/>
    <!-- Árbol 2 -->
    <rect x="310" y="480" width="16" height="160" fill="#451a03" rx="3"/>
    <circle cx="318" cy="430" r="65" fill="#047857" opacity="0.9"/>
    <circle cx="350" cy="450" r="50" fill="#065f46" opacity="0.9"/>
    <!-- Árbol 3 -->
    <rect x="610" y="440" width="22" height="200" fill="#78350f" rx="3"/>
    <circle cx="620" cy="390" r="90" fill="url(#treeGrad)" opacity="0.95"/>
    <circle cx="570" cy="420" r="70" fill="#059669" opacity="0.9"/>
    <circle cx="670" cy="410" r="70" fill="#10b981" opacity="0.9"/>
  </g>

  <!-- Ciclovía Segura -->
  <rect x="0" y="620" width="800" height="180" fill="#111827"/>
  <rect x="0" y="640" width="800" height="60" fill="#0284c7" opacity="0.85"/>
  <line x1="0" y1="670" x2="800" y2="670" stroke="#ffffff" stroke-width="4" stroke-dasharray="20,15"/>

  <!-- Bicicleta -->
  <g stroke="#ffffff" stroke-width="3.5" fill="none" opacity="0.95">
    <circle cx="380" cy="670" r="14"/>
    <circle cx="430" cy="670" r="14"/>
    <polyline points="380,670 400,655 420,655 430,670"/>
    <polyline points="400,655 410,670 395,670"/>
    <line x1="420" y1="655" x2="425" y2="648"/>
    <line x1="418" y1="648" x2="432" y2="648"/>
  </g>

  <!-- Contenedores de Reciclaje y Aseo Urbano -->
  <g>
    <!-- Campana Verde (Vidrio) -->
    <path d="M 480,600 L 485,550 Q 500,530 515,550 L 520,600 Z" fill="#16a34a" stroke="#86efac" stroke-width="2"/>
    <rect x="495" y="560" width="10" height="15" rx="5" fill="#052e16"/>
    <!-- Contenedor Azul (Papel y Cartón) -->
    <rect x="535" y="540" width="35" height="60" rx="5" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <rect x="542" y="550" width="21" height="6" fill="#1e1b4b"/>
    <!-- Contenedor Amarillo (Plásticos y Envases) -->
    <rect x="580" y="540" width="35" height="60" rx="5" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
    <circle cx="597" cy="560" r="5" fill="#422006"/>
  </g>

  <!-- Bus Eléctrico al fondo -->
  <g opacity="0.85">
    <rect x="20" y="540" width="120" height="75" rx="8" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="20" y="580" width="120" height="35" fill="#ffffff"/>
    <rect x="30" y="550" width="30" height="25" rx="2" fill="#1e293b"/>
    <rect x="70" y="550" width="30" height="25" rx="2" fill="#1e293b"/>
    <circle cx="45" cy="615" r="10" fill="#111827" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="115" cy="615" r="10" fill="#111827" stroke="#9ca3af" stroke-width="2"/>
  </g>

  <!-- Ondas Sonoras -->
  <path d="M 660,610 Q 690,590 720,610 T 780,610" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="0.7"/>
  <path d="M 670,595 Q 700,575 730,595 T 790,595" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.5"/>

  <!-- Rótulo -->
  <rect x="40" y="40" width="400" height="80" rx="10" fill="#042f2e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="72" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="2">SOCIOAMBIENTE Y METABOLISMO</text>
  <text x="60" y="98" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Movilidad, Verde y Residuos</text>
</svg>